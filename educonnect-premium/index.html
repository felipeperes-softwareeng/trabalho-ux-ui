<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060606" />
    <meta name="description" content="EduConnect: portal acadêmico com notas, disciplinas, matrícula e perfil em uma interface premium e responsiva." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EduConnect | Portal acadêmico</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura, para a página não "piscar" no tema errado.
      try {
        var t = localStorage.getItem('educonnect-theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t)
          if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f5f9')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
